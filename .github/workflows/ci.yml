name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      should_fail:
        description: "Fail the build?"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run CI check
        id: check
        run: node scripts/ci-check.js ${{ github.event.inputs.should_fail || false }}
